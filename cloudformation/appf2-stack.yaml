AWSTemplateFormatVersion: "2010-09-09"
Description: "Cloud Blog - ALB + EC2 Auto Scaling + RDS + S3 + Lambda in existing VPC"

Parameters:
  ProjectName:
    Type: String
    Default: cloud-blog
    Description: Prefix for tagging resources

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where resources will be created

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet for ALB and ASG

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet for ALB and ASG

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet for RDS

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet for RDS

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type for web servers

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 KeyPair to enable SSH access

  DesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Desired number of EC2 instances in ASG

  MinSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Minimum number of EC2 instances in ASG

  MaxSize:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 6
    Description: Maximum number of EC2 instances in ASG

  AmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    Description: SSM parameter for latest Amazon Linux 2023 AMI

  DBUsername:
    Type: String
    Default: bloguser
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "[a-zA-Z0-9_]+"
    Description: Master username for the RDS database

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    Description: Master user password for the RDS database

  DBName:
    Type: String
    Default: blogdb
    MinLength: 1
    MaxLength: 64
    AllowedPattern: "[a-zA-Z0-9_]+"
    Description: Initial database name

Resources:
  # -------------------------
  # Security Groups
  # -------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-sg"

  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for web EC2 instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ec2-sg"

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref Ec2SecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rds-sg"
  # -------------------------
  # IAM Role + Instance Profile for EC2 (S3 access)
  # -------------------------
  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-web-server-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      Policies:
        - PolicyName: !Sub "${ProjectName}-s3-blog-images-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-images-${AWS::AccountId}-${AWS::Region}/*"

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-web-instance-profile"
      Roles:
        - !Ref WebServerRole


  # -------------------------
  # Launch Template for EC2
  # -------------------------
  WebServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-web-lt"
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        IamInstanceProfile:
          Arn: !GetAtt WebServerInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref Ec2SecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            # Install Apache and PHP
            yum install -y httpd php php-mysqli
            systemctl enable httpd
            systemctl start httpd

            # Simple placeholder index.php (we'll replace this later with real app)
            cat << 'EOF' > /var/www/html/index.php
            <?php
              echo "<h1>Cloud Blog - Placeholder</h1>";
              echo "<p>If you see this, your ALB -> EC2 -> Apache -> PHP path works.</p>";
            ?>
            EOF

            chown apache:apache /var/www/html/index.php
            systemctl restart httpd

  # -------------------------
  # Application Load Balancer
  # -------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg"
      VpcId: !Ref VpcId
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /
      Matcher:
        HttpCode: "200-399"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # -------------------------
  # Auto Scaling Group
  # -------------------------
  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${ProjectName}-asg"
      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs:
        - !Ref WebTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      LaunchTemplate:
        LaunchTemplateId: !Ref WebServerLaunchTemplate
        Version: !GetAtt WebServerLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-web-server"
          PropagateAtLaunch: true

  # -------------------------
  # RDS Subnet Group + Instance
  # -------------------------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS instance
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db-subnet-group"

  BlogDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      AllocatedStorage: 20
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: "8.0"
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      MultiAZ: false
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      BackupRetentionPeriod: 1
      DeletionProtection: false
      DeleteAutomatedBackups: true

  # -------------------------
  # S3 Bucket for Images
  # -------------------------
  BlogImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-images-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt S3UploadLoggerFunction.Arn

  # -------------------------
  # Lambda Role + Function (logs S3 uploads)
  # -------------------------
  S3UploadLoggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-s3-upload-logger-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-lambda-logs-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  S3UploadLoggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-s3-upload-logger"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt S3UploadLoggerRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              logger.info("Received event: %s", json.dumps(event))
              records = event.get("Records", [])
              for record in records:
                  s3 = record.get("s3", {})
                  bucket = s3.get("bucket", {}).get("name")
                  obj = s3.get("object", {})
                  key = obj.get("key")
                  size = obj.get("size")
                  logger.info(f"New object uploaded: bucket={bucket}, key={key}, size={size}")
              return {"statusCode": 200}

  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3UploadLoggerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com

Outputs:
  LoadBalancerDNSName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  Ec2SecurityGroupId:
    Description: Security group ID for web EC2 instances
    Value: !Ref Ec2SecurityGroup

  AlbSecurityGroupId:
    Description: Security group ID for ALB
    Value: !Ref AlbSecurityGroup

  RdsSecurityGroupId:
    Description: Security group ID for RDS
    Value: !Ref RdsSecurityGroup

  DatabaseEndpoint:
    Description: Endpoint of the RDS database
    Value: !GetAtt BlogDatabase.Endpoint.Address

  DatabaseName:
    Description: Name of the database
    Value: !Ref DBName

  DatabaseUsername:
    Description: Master username for the database
    Value: !Ref DBUsername

  BlogImagesBucketName:
    Description: Name of the S3 bucket for blog images
    Value: !Ref BlogImagesBucket

  S3UploadLoggerFunctionName:
    Description: Name of the Lambda function that logs S3 uploads
    Value: !Ref S3UploadLoggerFunction
